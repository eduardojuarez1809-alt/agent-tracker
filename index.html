<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Status Tracker - Gateless</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 380px; border-top: 5px solid #00b4d8; text-align: center; }
    
    /* Título Elegante Gateless */
    .brand-header { margin-bottom: 20px; }
    .brand-title {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #1e2246;
      text-transform: lowercase;
      margin: 0;
      line-height: 1.2;
    }
    .brand-title::first-letter { text-transform: uppercase; }
    .brand-subtitle {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #00b4d8;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 4px;
    }

    .header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .header input { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; text-align: center; }
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; background: #e0e1dd; font-weight: 600; font-size: 0.9rem; text-align: center; }
    .timer { font-size: 2.2rem; font-weight: bold; color: #1e2246; text-align: center; margin: 15px 0; }
    .timer.overtime { color: #d90429; animation: pulse 1s infinite; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    button { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; background: #edf2f4; color: #2b2d42; }
    button:hover { background: #8d99ae; color: white; }
    button.active { background: #00b4d8; color: white; }
    .btn-out { grid-column: span 2; background: #d90429; color: white; margin-top: 10px; }
    .btn-out:hover { background: #ef233c; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="card">
  <!-- Título Elegante Gateless -->
  <div class="brand-header">
    <h1 class="brand-title">gateless</h1>
    <div class="brand-subtitle">Agent Tracker</div>
  </div>

  <div class="header">
    <input type="text" id="agentName" placeholder="Nombre / ID del Agente" oninput="saveAgentName()">
    <div id="currentStatus" class="status-badge">Estado: Offline</div>
  </div>

  <div class="timer" id="timerDisplay">00:00:00</div>

  <div class="grid">
    <button onclick="changeStatus('Available', 0)">Available</button>
    <button onclick="changeStatus('Break 1', 15)">Break 1 (15m)</button>
    <button onclick="changeStatus('Lunch', 60)">Lunch (60m)</button>
    <button onclick="changeStatus('Break 2', 15)">Break 2 (15m)</button>
    <button onclick="changeStatus('Bathroom', 0)">Bathroom</button>
    <button onclick="changeStatus('Personal', 0)">Personal (Emerg.)</button>
    <button class="btn-out" onclick="changeStatus('Out of Shift', 0)">Out of Shift</button>
  </div>
</div>

<script>
  const WEB_APP_URL = "const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4feS6S4dbzvues52hTDw6qJLnmrDRVZcxdFpptXHctMbuqKB3mnAXUoONJ_MeP5XFvw/exec';";

  let currentStatus = 'Offline';
  let startTime = null;
  let timerInterval = null;
  let maxMinutes = 0;

  // Al cargar la página, intentar restaurar la sesión guardada
  window.onload = function() {
    restoreSession();
  };

  function saveAgentName() {
    const agent = document.getElementById('agentName').value.trim();
    localStorage.setItem('tracker_agentName', agent);
  }

  function changeStatus(newStatus, limitMinutes) {
    const agent = document.getElementById('agentName').value.trim();
    if (!agent) {
      alert("Por favor ingresa tu nombre o ID antes de marcar un estado.");
      return;
    }

    const now = new Date();

    // Enviar datos del estado anterior a Google Sheets
    if (currentStatus !== 'Offline' && startTime) {
      const endTime = now;
      const durationSeconds = Math.floor((endTime - startTime) / 1000);
      const durationMinutes = parseFloat((durationSeconds / 60).toFixed(2));
      const isOvertime = maxMinutes > 0 && (durationSeconds > maxMinutes * 60);

      const payload = {
        date: startTime.toLocaleDateString(),
        agent: agent,
        status: currentStatus,
        startTime: startTime.toLocaleTimeString(),
        endTime: endTime.toLocaleTimeString(),
        durationSeconds: durationSeconds,
        durationMinutes: durationMinutes,
        overtime: isOvertime ? "SÍ" : "NO"
      };

      sendDataToSheets(payload);
    }

    // Si el usuario da "Out of Shift", limpiamos la memoria guardada
    if (newStatus === 'Out of Shift') {
      clearInterval(timerInterval);
      document.getElementById('timerDisplay').innerText = "00:00:00";
      document.getElementById('timerDisplay').classList.remove('overtime');
      document.getElementById('currentStatus').innerText = "Estado: Offline";
      currentStatus = 'Offline';
      
      // Limpieza de localStorage
      localStorage.removeItem('tracker_currentStatus');
      localStorage.removeItem('tracker_startTime');
      localStorage.removeItem('tracker_maxMinutes');

      alert("Shift finalizado con éxito.");
      return;
    }

    // Guardar nuevo estado en variables y en localStorage
    currentStatus = newStatus;
    maxMinutes = limitMinutes;
    startTime = now;

    localStorage.setItem('tracker_currentStatus', currentStatus);
    localStorage.setItem('tracker_startTime', startTime.toISOString());
    localStorage.setItem('tracker_maxMinutes', maxMinutes);

    document.getElementById('currentStatus').innerText = "Estado: " + newStatus;

    startTimer();
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsed = Math.floor((new Date() - startTime) / 1000);
      const hrs = String(Math.floor(elapsed / 3600)).padStart(2, '0');
      const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');

      const timerElement = document.getElementById('timerDisplay');
      timerElement.innerText = `${hrs}:${mins}:${secs}`;

      if (maxMinutes > 0 && elapsed > maxMinutes * 60) {
        timerElement.classList.add('overtime');
      } else {
        timerElement.classList.remove('overtime');
      }
    }, 1000);
  }

  function restoreSession() {
    const savedAgent = localStorage.getItem('tracker_agentName');
    const savedStatus = localStorage.getItem('tracker_currentStatus');
    const savedStartTime = localStorage.getItem('tracker_startTime');
    const savedMaxMinutes = localStorage.getItem('tracker_maxMinutes');

    if (savedAgent) {
      document.getElementById('agentName').value = savedAgent;
    }

    if (savedStatus && savedStartTime) {
      currentStatus = savedStatus;
      startTime = new Date(savedStartTime);
      maxMinutes = parseInt(savedMaxMinutes) || 0;

      document.getElementById('currentStatus').innerText = "Estado: " + currentStatus;
      startTimer();
    }
  }

  function sendDataToSheets(data) {
    fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data)
    })
    .then(() => console.log("Datos enviados a Google Sheets:", data))
    .catch(err => console.error("Error al enviar datos:", err));
  }
</script>

</body>
</html>
